<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance-region overlap: allowed versus prohibited</title>
  <desc id="desc">Left: Machine A and its tall maintenance region share top and bottom edges. Machine B and its shorter maintenance region share top and bottom edges. Machine B begins exactly where A maintenance ends; B maintenance overlaps the end of A maintenance but does not extend into either machine body. Right: Machine B's own maintenance area remains blue, but a part of Machine B's solid body intrudes into Machine A's maintenance region and is highlighted red.</desc>
  <rect width="960" height="350" fill="#FCFCFA"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#303438">
    <text x="20" y="27" font-size="17" font-weight="700">The meaning of an overlap depends on the objects</text>
    <rect x="16" y="50" width="450" height="262" rx="8" fill="#FFFFFF" stroke="#CCD3D0" stroke-width="1.5"/>
    <rect x="494" y="50" width="450" height="262" rx="8" fill="#FFFFFF" stroke="#CCD3D0" stroke-width="1.5"/>
    <text x="32" y="78" font-size="15" font-weight="700">Maintenance–maintenance</text>
    <text x="510" y="78" font-size="15" font-weight="700">Maintenance–equipment</text>

    <!-- Left: A's tall maintenance region ends flush against Machine B.
         B's shorter maintenance region ends flush against its own machine body.
         The B maintenance region overlaps A's, but neither enters a machine body. -->
    <rect x="48" y="118" width="120" height="138" rx="4" fill="#E5E8E7" stroke="#67716F" stroke-width="2"/>
    <rect x="168" y="118" width="137" height="138" rx="4" fill="#DDEAF3" fill-opacity=".74" stroke="#4B7191" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="262" y="151" width="43" height="90" rx="3" fill="#DCE9E3" fill-opacity=".96" stroke="#4B7191" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="305" y="151" width="138" height="90" rx="4" fill="#E5E8E7" stroke="#67716F" stroke-width="2"/>
    <text x="71" y="192" font-size="14">Machine A</text>
    <text x="332" y="200" font-size="14">Machine B</text>
    <text x="178" y="108" font-size="12" fill="#345A78">A maintenance</text>
    <text x="265" y="274" font-size="12" fill="#345A78">B maintenance</text>
    <text x="241" y="298" font-size="12" text-anchor="middle" fill="#356B5B" font-weight="700">ALLOWED UNDER THIS RULE</text>

    <!-- Right: B maintenance is adjacent to B body and matches its height.
         B maintenance overlaps A maintenance (allowed); the RED region is
         exclusively the physical overlap of Machine B's BODY with A maintenance. -->
    <rect x="532" y="118" width="116" height="138" rx="4" fill="#E5E8E7" stroke="#67716F" stroke-width="2"/>
    <rect x="648" y="118" width="178" height="138" rx="4" fill="#DDEAF3" fill-opacity=".74" stroke="#4B7191" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="733" y="151" width="57" height="90" rx="3" fill="#DDEAF3" fill-opacity=".79" stroke="#4B7191" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="790" y="151" width="134" height="90" rx="4" fill="#E5E8E7" stroke="#67716F" stroke-width="2"/>
    <rect x="790" y="151" width="36" height="90" fill="#F1BBB8" fill-opacity=".85" stroke="#BA4E4A" stroke-width="1.5"/>
    <text x="550" y="192" font-size="14">Machine A</text>
    <text x="842" y="200" font-size="14">Machine B</text>
    <text x="655" y="108" font-size="12" fill="#345A78">A maintenance</text>
    <text x="734" y="273" font-size="12" fill="#345A78">B maintenance</text>
    <text x="811" y="147" font-size="10" fill="#A03C39" font-weight="700">B body intrusion</text>
    <text x="719" y="298" font-size="12" text-anchor="middle" fill="#A03C39" font-weight="700">VIOLATION UNDER THIS RULE</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666A70">
    <rect x="20" y="328" width="15" height="12" fill="#E5E8E7" stroke="#67716F"/>
    <text x="42" y="339">Machine body</text>
    <rect x="177" y="328" width="15" height="12" fill="#DDEAF3" stroke="#4B7191" stroke-dasharray="3 2"/>
    <text x="199" y="339">Maintenance region</text>
    <rect x="389" y="328" width="15" height="12" fill="#F1BBB8" stroke="#BA4E4A"/>
    <text x="411" y="339">Prohibited overlap</text>
  </g>
</svg>
